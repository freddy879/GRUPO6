<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario PRO Móvil</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#111;color:#fff;text-align:center;padding:15px}
.container{padding:15px}
input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{background:#28a745;color:white;border:none}
.card{background:white;padding:12px;margin:10px 0;border-radius:12px}
.low{color:red;font-weight:bold}
video{width:100%;border-radius:10px}
</style>
</head>
<body>
<header><h2>Inventario PRO 📱</h2></header>

<div class="container">
<h3>Escanear código de barras</h3>
<video id="preview" autoplay muted playsinline></video>
<button onclick="iniciarCamara()">Activar Cámara</button>

<input id="codigo" placeholder="Código de barras">
<input id="nombre" placeholder="Producto">
<input id="compra" type="number" placeholder="Compra">
<input id="venta" type="number" placeholder="Venta">
<input id="stock" type="number" placeholder="Stock">
<button onclick="agregar()">Agregar</button>

<h3>Vender</h3>
<select id="productoVenta"></select>
<input id="cantidadVenta" type="number" placeholder="Cantidad">
<button onclick="vender()">Vender</button>

<h3>Inventario</h3>
<div id="lista"></div>

<p id="ganancia"></p>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
let data = JSON.parse(localStorage.getItem('inv')) || {bodega:[], ventas:[]};

function guardar(){
localStorage.setItem('inv', JSON.stringify(data));
}

function agregar(){
let codigo = document.getElementById('codigo').value.trim();
let nombre = document.getElementById('nombre').value.trim();
let compra = parseFloat(document.getElementById('compra').value);
let venta = parseFloat(document.getElementById('venta').value);
let stock = parseInt(document.getElementById('stock').value);

if(!codigo || !nombre || isNaN(compra) || isNaN(venta) || isNaN(stock)){
return alert('Completa todos los campos correctamente');
}

if(data.bodega.find(p=>p.codigo===codigo)) return alert('Producto duplicado');

data.bodega.push({codigo,nombre,compra,venta,stock});

guardar(); render(); limpiar();
}

function vender(){
let prod = document.getElementById('productoVenta').value;
let cant = parseInt(document.getElementById('cantidadVenta').value);
let p = data.bodega.find(x=>x.codigo===prod);

if(!p) return alert('Producto no encontrado');
if(isNaN(cant) || cant <= 0) return alert('Cantidad inválida');
if(p.stock < cant) return alert('Sin stock');

p.stock -= cant;
let gan = (p.venta - p.compra) * cant;

data.ventas.push({codigo:prod,gan});

guardar(); render();
}

function render(){
let lista = document.getElementById('lista');
let select = document.getElementById('productoVenta');
lista.innerHTML=''; 
select.innerHTML='';
let totalGan=0;

data.bodega.forEach((p)=>{
lista.innerHTML += `<div class="card">
<strong>${p.nombre}</strong><br>
Código: ${p.codigo}<br>
Stock: <span class="${p.stock<5?'low':''}">${p.stock}</span>
</div>`;

select.innerHTML += `<option value="${p.codigo}">${p.nombre}</option>`;
});

data.ventas.forEach(v=> totalGan += v.gan);

document.getElementById('ganancia').innerText = 'Ganancia: $'+totalGan.toFixed(2);
}

function limpiar(){
['codigo','nombre','compra','venta','stock'].forEach(id=>document.getElementById(id).value='');
}

// ESCANER FUNCIONANDO EN CELULAR
let codeReader;
async function iniciarCamara(){
try{
const videoElement = document.getElementById('preview');

// Pedir cámara trasera (importante para celular)
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { exact: "environment" } }
});

videoElement.srcObject = stream;

codeReader = new ZXing.BrowserBarcodeReader();
codeReader.decodeFromVideoDevice(null, videoElement, (result, err) => {
if(result){
document.getElementById('codigo').value = result.text;
}
});

}catch(e){
alert('Error activando cámara: ' + e.message);
}
}

render();
</script>
</body>
</html>
